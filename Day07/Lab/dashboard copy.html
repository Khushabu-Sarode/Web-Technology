<!doctype html>
<html lang="en">
  <head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="bootstrap.min.css" />
    <script src="bootstrap.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="alert alert-warning" style="margin-top: 20px;">
        <h3 id="countLabel">Total Item purchased : </h3>
      </div>
      <div class="row" id="productContainerDiv"></div>
    </div>
    <script>
      function GetProducts() {
        var helper = new XMLHttpRequest();
        helper.onreadystatechange = () => {
          if (helper.readyState == 4 && helper.status == 200) {
            var replyFromServer = JSON.parse(helper.responseText);
            //console.log(replyFromServer.products);
            var products = replyFromServer.products;
            var refToProductContainerDiv = document.getElementById(
              "productContainerDiv",
            );

            for (i = 0; i < products.length; i++) {
              var product = products[i];

              var productUI = `<div id="${product.id}" class="col-md-4">
          <img
            class="img-fluid"
            src="${product.thumbnail}"
            alt="${product.title}"
          />
          <hr />
          <h3>${product.title}</h3>
          <h4>Price : ${product.price} INR</h4>

          <button class="btn btn-primary" 
                  onclick="AddToCart(${product.id}, 
                                    '${product.title}', 
                                     ${product.price})">Add To Cart
          </button>
       
        </div>`;

              refToProductContainerDiv.innerHTML =
                refToProductContainerDiv.innerHTML + productUI;
            }
          }
        };
        helper.open("GET", "https://dummyjson.com/products");
        helper.send();
      }

      var productsPurchased = new Array();

      function AddToCart(id, title, price) {
        // console.log("U purchased");
        // console.log(`${id} | ${title} | ${price}`);
        productsPurchased.push({ id: id, title: title, price: price });

        var productsPurchasedInStringForm = JSON.stringify(productsPurchased);

        console.log(productsPurchasedInStringForm);

        sessionStorage.setItem(
          "purchasedProducts",
          productsPurchasedInStringForm,
        );
      }

      GetProducts();
    </script>
  </body>
</html>
